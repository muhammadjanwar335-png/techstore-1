<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Produk - TechStore</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="navbarContainer"></div>

<main class="container py-4">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb small" id="breadcrumbList">
            <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none text-muted">Beranda</a></li>
            <li class="breadcrumb-item"><a href="customer/products.html" class="text-decoration-none text-muted">Katalog</a></li>
            <li class="breadcrumb-item active text-truncate" style="max-width: 250px;" id="breadcrumbCurrent">Detail Produk</li>
        </ol>
    </nav>

    <!-- Product Details Main Grid -->
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-5" id="productDetailCard">
        <div class="card-body p-4 p-lg-5">
            <div class="row g-5">
                <!-- Kolom Gambar -->
                <div class="col-lg-5">
                    <div class="position-relative bg-light rounded-4 overflow-hidden border p-3 text-center">
                        <img id="detailImage" src="" alt="Produk" class="img-fluid rounded-3" style="max-height: 420px; object-fit: contain;">
                        <span class="position-absolute top-0 start-0 m-3 badge bg-dark bg-opacity-75 px-3 py-2 rounded-pill" id="detailCategoryBadge">
                            Kategori
                        </span>
                    </div>
                </div>

                <!-- Kolom Informasi Produk & Form Keranjang -->
                <div class="col-lg-7">
                    <div class="mb-2">
                        <span class="text-primary fw-bold text-uppercase small" id="detailCategoryName">
                            <i class="bi bi-tag-fill me-1"></i>Hardware
                        </span>
                    </div>
                    <h2 class="fw-bold mb-3" id="detailTitle">Nama Produk</h2>

                    <div class="d-flex align-items-center gap-3 mb-4">
                        <div class="fs-2 fw-extrabold text-primary" id="detailPrice">Rp 0</div>
                        <div id="detailStockBadge"></div>
                    </div>

                    <hr class="my-4 text-muted">

                    <h5 class="fw-bold mb-2">Deskripsi Produk</h5>
                    <div class="text-secondary leading-relaxed mb-4" id="detailDescription" style="white-space: pre-line;">
                        Deskripsi spesifikasi produk.
                    </div>

                    <div class="row g-3 mb-4 text-secondary small">
                        <div class="col-sm-6">
                            <div class="p-2 border rounded bg-light">
                                <i class="bi bi-box-seam text-primary me-2"></i><strong>Berat Pengiriman:</strong> <span id="detailWeight">500</span> gram
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="p-2 border rounded bg-light">
                                <i class="bi bi-shield-check text-primary me-2"></i><strong>Garansi:</strong> 1 Tahun Resmi Distributor
                            </div>
                        </div>
                    </div>

                    <!-- Form Tambah ke Keranjang -->
                    <div id="actionArea">
                        <div class="d-flex align-items-center gap-3 mb-4">
                            <label class="fw-bold text-dark mb-0">Jumlah:</label>
                            <div class="input-group" style="width: 140px;">
                                <button class="btn btn-outline-secondary" type="button" onclick="decrementQty()">-</button>
                                <input type="number" id="qtyInput" class="form-control text-center" value="1" min="1">
                                <button class="btn btn-outline-secondary" type="button" onclick="incrementQty()">+</button>
                            </div>
                            <small class="text-muted" id="detailMaxStock">Maksimal 0 unit</small>
                        </div>

                        <div class="d-flex gap-3">
                            <button type="button" class="btn btn-primary btn-lg px-4 flex-grow-1 shadow-sm" onclick="addToCartCurrent()">
                                <i class="bi bi-cart-plus me-2"></i>Tambahkan ke Keranjang
                            </button>
                            <button type="button" class="btn btn-navy btn-lg px-4 shadow-sm" onclick="buyNowCurrent()">
                                Beli Sekarang &rarr;
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Related Products -->
    <div class="mb-5" id="relatedSection">
        <h4 class="fw-bold mb-4">Produk Terkait Lainnya</h4>
        <div class="row g-4 row-cols-1 row-cols-sm-2 row-cols-lg-4" id="relatedGrid"></div>
    </div>
</main>

<div id="footerContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/db.js"></script>

<script>
let currentProduct = null;

document.addEventListener('DOMContentLoaded', function () {
    TechDB.renderNavbar('navbarContainer', '', '');
    TechDB.renderFooter('footerContainer', '');

    const params = new URLSearchParams(window.location.search);
    const prodId = parseInt(params.get('id'));

    if (!prodId) {
        window.location.href = 'customer/products.html';
        return;
    }

    currentProduct = TechDB.getProductById(prodId);
    if (!currentProduct) {
        alert('Produk tidak ditemukan!');
        window.location.href = 'customer/products.html';
        return;
    }

    const cat = TechDB.getCategoryById(currentProduct.categoryId) || {};

    // Render detail data
    document.title = currentProduct.name + ' - TechStore';
    document.getElementById('breadcrumbCurrent').textContent = currentProduct.name;
    document.getElementById('detailImage').src = currentProduct.image;
    document.getElementById('detailCategoryBadge').textContent = cat.name || 'Hardware';
    document.getElementById('detailCategoryName').innerHTML = `<i class="bi bi-tag-fill me-1"></i>${cat.name || 'Hardware'}`;
    document.getElementById('detailTitle').textContent = currentProduct.name;
    document.getElementById('detailPrice').textContent = TechDB.formatRupiah(currentProduct.price);
    document.getElementById('detailDescription').textContent = currentProduct.description;
    document.getElementById('detailWeight').textContent = currentProduct.weight || 500;
    document.getElementById('detailMaxStock').textContent = `Maksimal ${currentProduct.stock} unit`;

    const qtyInput = document.getElementById('qtyInput');
    qtyInput.max = currentProduct.stock;

    const stockBadge = document.getElementById('detailStockBadge');
    if (currentProduct.stock <= 0) {
        stockBadge.innerHTML = `<span class="badge bg-danger-subtle text-danger border border-danger-subtle px-3 py-2 rounded-pill"><i class="bi bi-x-circle-fill me-1"></i>Stok Habis</span>`;
        document.getElementById('actionArea').innerHTML = `<div class="alert alert-secondary py-3 text-center"><i class="bi bi-bell-slash me-2"></i>Maaf, stok barang ini sedang kosong. Silakan cek produk lainnya.</div>`;
    } else if (currentProduct.stock < 5) {
        stockBadge.innerHTML = `<span class="badge bg-warning-subtle text-warning border border-warning-subtle px-3 py-2 rounded-pill"><i class="bi bi-exclamation-circle-fill me-1"></i>Stok Menipis (Tersisa ${currentProduct.stock} unit)</span>`;
    } else {
        stockBadge.innerHTML = `<span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2 rounded-pill"><i class="bi bi-check-circle-fill me-1"></i>Stok Tersedia (${currentProduct.stock} unit)</span>`;
    }

    // Render Related Products
    const related = TechDB.getProducts()
        .filter(p => p.categoryId === currentProduct.categoryId && p.id !== currentProduct.id)
        .slice(0, 4);

    const relatedGrid = document.getElementById('relatedGrid');
    if (related.length === 0) {
        document.getElementById('relatedSection').style.display = 'none';
    } else {
        relatedGrid.innerHTML = related.map(rel => `
            <div class="col">
                <div class="product-card">
                    <div class="img-wrapper">
                        <img src="${rel.image}" alt="${rel.name}">
                        <span class="category-badge">${cat.name || 'Hardware'}</span>
                    </div>
                    <div class="card-body">
                        <a href="product-detail.html?id=${rel.id}" class="product-title" title="${rel.name}">
                            ${rel.name}
                        </a>
                        <div class="price-tag">${TechDB.formatRupiah(rel.price)}</div>
                        <a href="product-detail.html?id=${rel.id}" class="btn btn-outline-primary btn-sm mt-auto w-100">
                            Detail Produk
                        </a>
                    </div>
                </div>
            </div>
        `).join('');
    }
});

function incrementQty() {
    const inp = document.getElementById('qtyInput');
    let val = parseInt(inp.value) || 1;
    if (currentProduct && val < currentProduct.stock) {
        inp.value = val + 1;
    }
}

function decrementQty() {
    const inp = document.getElementById('qtyInput');
    let val = parseInt(inp.value) || 1;
    if (val > 1) {
        inp.value = val - 1;
    }
}

function addToCartCurrent() {
    const qty = parseInt(document.getElementById('qtyInput').value) || 1;
    const res = TechDB.addToCart(currentProduct.id, qty);
    if (res.success) {
        TechDB.renderNavbar('navbarContainer', '', '');
        alert('Produk berhasil ditambahkan ke keranjang belanja!');
    } else {
        alert(res.message);
    }
}

function buyNowCurrent() {
    const qty = parseInt(document.getElementById('qtyInput').value) || 1;
    const res = TechDB.addToCart(currentProduct.id, qty);
    if (res.success) {
        window.location.href = 'customer/checkout.html';
    } else {
        alert(res.message);
    }
}
</script>
</body>
</html>
